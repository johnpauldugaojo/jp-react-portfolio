<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | John Paul Dugaojo</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #23153c;
        font-family: 'Inter', system-ui, sans-serif;
        color: #ede9fe;
        text-align: center;
        padding: 2rem;
      }
      .code {
        font-size: 7rem;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, #22d3ee, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.75rem; }
      p { color: #c4b5fd; margin-bottom: 2rem; max-width: 400px; line-height: 1.6; }
      a {
        display: inline-block;
        padding: 0.75rem 2rem;
        background: #0891b2;
        color: #fff;
        border-radius: 0.5rem;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s;
      }
      a:hover { background: #0e7490; }
      .countdown { font-size: 0.85rem; color: #7c3aed; margin-top: 1.25rem; }
    </style>
  </head>
  <body>
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or may have been moved.</p>
    <a href="/">Go Back Home</a>
    <p class="countdown" id="msg">Redirecting in 5 seconds…</p>
    <script>
      let s = 5;
      const el = document.getElementById('msg');
      const t = setInterval(() => {
        s--;
        el.textContent = `Redirecting in ${s} second${s !== 1 ? 's' : ''}…`;
        if (s <= 0) { clearInterval(t); window.location.href = '/'; }
      }, 1000);
    </script>
  </body>
</html>
